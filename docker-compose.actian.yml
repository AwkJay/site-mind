services:
  vectorai:
    image: actian/vectorai:latest
    container_name: actian_vectorai_db
    ports:
      - "6573-6575:6573-6575" # 6573 REST, 6574 gRPC (actian_vectorai client default), 6575 LocalUI
    volumes:
      - ./actian_data:/var/lib/actian-vectorai
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
    restart: unless-stopped
